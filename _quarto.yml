project:
  type: book
  output-dir: docs

book:
  title: "Clinical and Omics Data Visualization in R"
  subtitle: "A Practical Handbook for Publication-Ready Figures with cliomicplot"
  author: "Van Hung Tran"
  date: today
  site-url: https://vanhungtran.github.io/cliomicplot_book/
  repo-url: https://github.com/vanhungtran/cliomicplot_book
  repo-actions: [edit, issue]

  chapters:
    - index.qmd

    - part: "Part I — Graphic Grammar and Design System"
      chapters:
        - 01-grammar-and-api.qmd
        - 02-journal-themes-and-scifig.qmd

    - part: "Part II — Clinical Trials and Survival Analysis"
      chapters:
        - 03-survival-analysis.qmd
        - 04-treatment-effects.qmd
        - 05-oncology-trajectories.qmd
        - 06-biomarkers-and-mcid.qmd

    - part: "Part III — High-Dimensional Omics Visualizations"
      chapters:
        - 07-differential-expression.qmd
        - 08-pathway-enrichment.qmd
        - 09-genomics-and-mgwas.qmd
        - 10-microbiome-and-dyad-sharing.qmd

    - part: "Part IV — Systems Biology and Coupled Multi-Network Architectures"
      chapters:
        - 11-cross-condition-networks.qmd
        - 12-topological-network-styles.qmd
        - 13-coupled-environmental-networks.qmd
        - 14-preservation-and-robustness.qmd
        - 15-empirical-linkage-and-permutations.qmd

    - part: "Part V — Publication Composites and Applied Case Studies"
      chapters:
        - 16-assembling-composites.qmd
        - 17-case-study-atopic-dermatitis.qmd
        - 18-case-study-cancer-immunotherapy.qmd
        - 19-case-study-nature-communications.qmd
        - 20-case-study-leakage-benchmark.qmd

    - references.qmd

bibliography: references.bib

execute:
  warning: false
  message: false
  echo: true
  eval: true
  output: true

format:
  html:
    theme:
      - cosmo
      - custom.scss
    lightbox:
      match: auto
      effect: zoom
      desc-position: bottom
      loop: false
    include-after-body: custom.js
    toc: true
    toc-depth: 3
    toc-expand: 2
    toc-title: "On this page"
    number-sections: true
    number-depth: 3
    code-fold: true
    code-summary: "Show R code"
    code-tools: true
    code-copy: true
    highlight-style: arrow
    anchor-sections: true
    link-external-newwindow: true
    link-external-icon: true
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true
    fig-width: 7.5
    fig-height: 5.0
    fig-dpi: 300
    prefer-html: true
    html-math-method: katex
    grid:
      sidebar-width: 300px
      body-width: 850px
      margin-width: 250px
